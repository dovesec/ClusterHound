<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#326CE5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#326CE5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#326CE5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#326CE5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="160" rx="16" fill="#0d1117" stroke="#1e3a6e" stroke-width="1"/>

  <!-- Glow behind emblem -->
  <circle cx="80" cy="80" r="44" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Outer ring -->
  <circle cx="80" cy="80" r="44" fill="none" stroke="#326CE5" stroke-width="1.5" opacity="0.45"/>

  <!-- Ring nodes -->
  <circle cx="80"  cy="36"  r="3" fill="#326CE5"/>
  <circle cx="118" cy="58"  r="3" fill="#326CE5"/>
  <circle cx="118" cy="102" r="3" fill="#326CE5"/>
  <circle cx="80"  cy="124" r="3" fill="#326CE5"/>
  <circle cx="42"  cy="102" r="3" fill="#326CE5"/>
  <circle cx="42"  cy="58"  r="3" fill="#326CE5"/>

  <!-- Ring edges -->
  <line x1="80"  y1="36"  x2="118" y2="58"  stroke="#326CE5" stroke-width="1" opacity="0.25"/>
  <line x1="118" y1="58"  x2="118" y2="102" stroke="#326CE5" stroke-width="1" opacity="0.25"/>
  <line x1="118" y1="102" x2="80"  y2="124" stroke="#326CE5" stroke-width="1" opacity="0.25"/>
  <line x1="80"  y1="124" x2="42"  y2="102" stroke="#326CE5" stroke-width="1" opacity="0.25"/>
  <line x1="42"  y1="102" x2="42"  y2="58"  stroke="#326CE5" stroke-width="1" opacity="0.25"/>
  <line x1="42"  y1="58"  x2="80"  y2="36"  stroke="#326CE5" stroke-width="1" opacity="0.25"/>

  <!-- circle-nodes icon (FA6 solid, scaled and centred at 80,80) -->
  <g transform="translate(80,80) scale(0.073) translate(-256,-256)">
    <path d="M418.4 157.9c35.3-8.3 61.6-40 61.6-77.9c0-44.2-35.8-80-80-80c-43.4 0-78.7 34.5-80 77.5L136.2 151.1C121.7 136.8 101.9 128 80 128c-44.2 0-80 35.8-80 80s35.8 80 80 80c12.2 0 23.8-2.7 34.1-7.6L259.7 407.8c-2.4 7.6-3.7 15.8-3.7 24.2c0 44.2 35.8 80 80 80s80-35.8 80-80c0-27.7-14-52.1-35.4-66.4l37.8-207.7zM156.3 232.2c2.2-6.9 3.5-14.2 3.7-21.7l183.8-73.5c3.6 3.5 7.4 6.7 11.6 9.5L317.6 354.1c-5.5 1.3-10.8 3.1-15.8 5.5L156.3 232.2z" fill="#326CE5"/>
  </g>

  <!-- Title -->
  <text x="158" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">ClusterHound</text>

  <!-- Subtitle -->
  <text x="160" y="101" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#326CE5" letter-spacing="3">KUBERNETES ATTACK PATH ANALYSIS</text>

